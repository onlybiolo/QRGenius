<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QRGenius – Free QR Code Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <meta name="description" content="Create custom QR codes instantly—no sign-up, no watermarks. 100% free & private.">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center py-10 px-4">
  <div class="max-w-2xl w-full text-center">
    <h1 class="text-3xl font-bold text-gray-800 mb-2">✨ QRGenius</h1>
    <p class="text-gray-600 mb-6">Free QR code generator. No signup. No ads on the QR.</p>
    
    <input 
      type="text" 
      id="urlInput" 
      placeholder="Paste a link, text, or contact info..."
      class="w-full p-4 border border-gray-300 rounded-xl mb-6 focus:outline-none focus:ring-2 focus:ring-blue-500 text-lg"
      value="https://example.com"
    >
    
    <div id="qrcode" class="flex justify-center my-6"></div>
    
    <button 
      onclick="downloadQR()" 
      class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-8 rounded-xl transition shadow-sm"
    >
      📥 Download PNG
    </button>

    <p class="text-xs text-gray-500 mt-8">Your data never leaves your browser. 100% private.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
